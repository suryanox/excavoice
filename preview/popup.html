<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ExcaVoice — popup preview</title>
    <link rel="stylesheet" href="../src/popup/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <div class="brand">
          <span class="brand__mark">◗</span>
          <span class="brand__name">ExcaVoice</span>
        </div>
        <p class="brand__tag">Speak a diagram. Draw it on Excalidraw.</p>
      </header>

      <section class="card">
        <h2 class="card__title">Provider</h2>

        <label class="field">
          <span class="field__label">Provider type</span>
          <select id="provider" class="field__control">
            <option value="openai">OpenAI compatible</option>
            <option value="openrouter">OpenRouter</option>
            <option value="litellm">LiteLLM</option>
          </select>
        </label>

        <label class="field">
          <span class="field__label">API base URL</span>
          <input
            id="baseUrl"
            class="field__control"
            type="text"
            placeholder="https://api.openai.com/v1"
            autocomplete="off"
            spellcheck="false"
          />
        </label>

        <label class="field">
          <span class="field__label">API key</span>
          <input
            id="apiKey"
            class="field__control"
            type="password"
            placeholder="sk-..."
            autocomplete="off"
          />
        </label>

        <label class="field">
          <span class="field__label">Model</span>
          <input
            id="model"
            class="field__control"
            type="text"
            placeholder="gpt-4o-mini"
            autocomplete="off"
            spellcheck="false"
          />
        </label>

        <label class="field field--inline">
          <input id="freePool" type="checkbox" class="field__check" />
          <span class="field__label">Use OpenRouter free-model round robin</span>
        </label>
      </section>

      <section class="card">
        <h2 class="card__title">Voice</h2>

        <label class="field">
          <span class="field__label">Microphone</span>
          <select id="mic" class="field__control">
            <option value="">Default device</option>
          </select>
        </label>

        <label class="field">
          <span class="field__label">Language</span>
          <select id="language" class="field__control">
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="ja">Japanese</option>
            <option value="zh">Chinese</option>
          </select>
        </label>

        <label class="field field--inline">
          <input id="autoDraw" type="checkbox" class="field__check" checked />
          <span class="field__label">Automatically render after transcript</span>
        </label>
      </section>

      <footer class="app__footer">
        <span id="status" class="status status--idle">Not connected</span>
        <button id="save" class="btn btn--primary" type="button">Save</button>
      </footer>
    </main>

    <script>
      const status = document.getElementById("status");
      document.getElementById("save").addEventListener("click", () => {
        status.textContent = "Saved (stub)";
        status.className = "status status--ok";
      });
    </script>
  </body>
</html>
