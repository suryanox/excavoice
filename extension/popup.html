<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ExcaVoice</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <div class="brand">
          <span class="brand__mark">◗</span>
          <span class="brand__name">ExcaVoice</span>
        </div>
        <p class="brand__tag">Speak a diagram. Draw it on Excalidraw.</p>
      </header>

      <section class="card">
        <h2 class="card__title">LLM</h2>

        <label class="field">
          <span class="field__label">API base URL</span>
          <input
            id="baseUrl"
            class="field__control"
            type="text"
            placeholder="https://litellm.example.com"
            autocomplete="off"
            spellcheck="false"
          />
        </label>

        <label class="field">
          <span class="field__label">API key</span>
          <input
            id="apiKey"
            class="field__control"
            type="password"
            placeholder="sk-..."
            autocomplete="off"
          />
        </label>

        <label class="field">
          <span class="field__label">Model</span>
          <input
            id="model"
            class="field__control"
            type="text"
            placeholder="gpt-4o-mini"
            autocomplete="off"
            spellcheck="false"
          />
        </label>

        <label class="field field--inline">
          <input id="freeModels" type="checkbox" class="field__check" />
          <span class="field__label">Use OpenRouter free models</span>
        </label>
      </section>

      <footer class="app__footer">
        <span id="status" class="status status--idle">Not connected</span>
        <button id="save" class="btn btn--primary" type="button">Save</button>
      </footer>
    </main>

    <script src="./popup.js"></script>
  </body>
</html>
